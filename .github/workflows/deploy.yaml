name: Frontend CI

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository }}:latest \
            -f Dockerfile.dev .

      - name: Run tests
        run: |
          docker run -e CI=true ghcr.io/${{ github.repository }}:latest npm test

      - name: Push image
        run: |
          docker push ghcr.io/${{ github.repository }}:latest
